<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="plantillas/plantilla::head">
    <title>Datos Personales del Técnico | SigmaWeb</title>
</head>

<body>
    <header th:replace="plantillas/plantilla::header"></header>
    <div th:replace="plantillas/plantilla::menu"></div>
    <div th:replace="plantillas/plantilla::notificaciones"></div>

    <div class="container my-4 animated-fadeIn">
        <form th:action="@{/guardarTecnicoPersonal}" method="post" th:object="${tecnico}" enctype="multipart/form-data">

            <!-- Preserved Hidden Fields -->
            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" th:field="*{estado}"/>
            <input type="hidden" th:field="*{especialidad}"/>
            <input type="hidden" th:field="*{fechaIngresoPlanta}"/>
            <input type="hidden" th:field="*{habilidades}"/>
            <input type="hidden" th:field="*{proyectosDestacados}"/>
            <input type="hidden" th:field="*{promedioEvaluaciones}"/>
            <input type="hidden" th:field="*{notasAdicionales}"/>

            <input type="hidden" th:field="*{satisfaccionClienteInterno}"/>
            <input type="hidden" th:field="*{predisposicionParaLaTarea}"/>
            <input type="hidden" th:field="*{responsabilidad}"/>
            <input type="hidden" th:field="*{cumplimientoNormasSeguridad}"/>
            <input type="hidden" th:field="*{nivelDeConocimiento}"/>
            <input type="hidden" th:field="*{tratoRecibidoPorCliente}"/>
            <input type="hidden" th:field="*{prolijidad}"/>
            <input type="hidden" th:field="*{puntualidad}"/>
            <input type="hidden" th:field="*{eficiencia}"/>
            <input type="hidden" th:field="*{calidadDelTrabajo}"/>
            <input type="hidden" th:field="*{comunicacion}"/>
            <input type="hidden" th:field="*{trabajoEnEquipo}"/>
            <input type="hidden" th:field="*{resolucionDeProblemas}"/>
            <input type="hidden" th:field="*{creatividadEInnovacion}"/>
            <input type="hidden" th:field="*{iniciativa}"/>
            <input type="hidden" th:field="*{autogestion}"/>
            <input type="hidden" th:field="*{formacionContinua}"/>

            <div class="sigma-card">
                <div class="sigma-card-header">
                    <h2 class="sigma-card-title mb-0">
                        <i class="fas fa-id-card text-primary"></i>
                        <span>Datos Personales del Técnico</span>
                    </h2>
                    <div class="d-flex align-items-center gap-2">
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="fas fa-save me-1"></i> Guardar
                        </button>
                        <a th:href="@{/layout}" class="btn btn-secondary btn-sm">
                            <i class="fas fa-arrow-left me-1"></i> Volver
                        </a>
                    </div>
                </div>

                <!-- Content Container -->
                <div class="p-3 rounded-3 border mb-4" style="background: var(--bg-surface-elevated); border-color: var(--border-color) !important;">
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="legajo" class="form-label detencion-label">Legajo</label>
                            <input type="text" class="form-control" id="legajo" th:field="*{legajo}" readonly>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="acercaDeMi" class="form-label detencion-label">
                            Acerca de mí
                            <i class="fa-regular fa-circle-question text-primary ms-1 custom-popover" tabindex="0" data-container="body" data-trigger="focus" data-toggle="popover" data-placement="right" data-content="Breve carta de presentación, por ejemplo: 'Soy técnico mecánico especializado en diagnóstico y mantenimiento preventivo.'"></i>
                        </label>
                        <textarea class="form-control" id="acercaDeMi" th:field="*{acercaDeMi}" rows="3" placeholder="Describa su perfil personal o presentación profesional..."></textarea>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label detencion-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="apellido" class="form-label detencion-label">Apellido</label>
                            <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="fechaNacimiento" class="form-label detencion-label">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="fechaNacimiento" th:field="*{fechaNacimiento}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="edad" class="form-label detencion-label">Edad</label>
                            <input type="text" class="form-control" id="edad" th:field="*{edad}" disabled>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="telefono" class="form-label detencion-label">Teléfono</label>
                            <input type="text" class="form-control" id="telefono" th:field="*{telefono}">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label detencion-label">Email</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="direccion" class="form-label detencion-label">Dirección</label>
                        <input type="text" class="form-control" id="direccion" th:field="*{direccion}">
                    </div>

                    <div class="mb-3">
                        <label for="formacion" class="form-label detencion-label">
                            Formación Académica
                            <i class="fa-regular fa-circle-question text-primary ms-1 custom-popover" tabindex="0" data-container="body" data-trigger="focus" data-toggle="popover" data-placement="right" data-content="Títulos obtenidos (secundario, terciario, universitario), cursos, especializaciones, etc."></i>
                        </label>
                        <textarea class="form-control" id="formacion" th:field="*{formacionAcademica}" rows="2"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="experiencia" class="form-label detencion-label">
                            Experiencia Laboral
                            <i class="fa-regular fa-circle-question text-primary ms-1 custom-popover" tabindex="0" data-container="body" data-trigger="focus" data-toggle="popover" data-placement="right" data-content="Listado de empresas, cargos y años de servicio en cada organización."></i>
                        </label>
                        <textarea class="form-control" id="experiencia" th:field="*{experienciaLaboral}" rows="2"></textarea>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="conocimientos" class="form-label detencion-label">
                                Conocimientos Varios
                                <i class="fa-regular fa-circle-question text-primary ms-1 custom-popover" tabindex="0" data-container="body" data-trigger="focus" data-toggle="popover" data-placement="right" data-content="Conocimientos empíricos y habilidades prácticas adicionales."></i>
                            </label>
                            <textarea class="form-control" id="conocimientos" th:field="*{conocimientosVarios}" rows="2"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="pasatiempos" class="form-label detencion-label">Pasatiempos / Intereses</label>
                            <textarea class="form-control" id="pasatiempos" th:field="*{pasatiempos}" rows="2"></textarea>
                        </div>
                    </div>

                </div>

                <!-- Footer Actions -->
                <div class="d-flex align-items-center justify-content-between pt-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i> Guardar
                    </button>
                    <a th:href="@{/layout}" class="btn btn-secondary ms-auto">
                        <i class="fas fa-arrow-left me-1"></i> Volver
                    </a>
                </div>

            </div>
        </form>
    </div>

    <!-- Scripts for Popovers -->
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof $ !== 'undefined' && $.fn.popover) {
                $('[data-toggle="popover"]').popover({ trigger: 'focus' });
            }
        });
    </script>
</body>
</html>
