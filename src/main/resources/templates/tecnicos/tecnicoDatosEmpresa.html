<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="plantillas/plantilla::head">
    <title>Datos de Empresa del Técnico | SigmaWeb</title>
</head>

<body>
    <header th:replace="plantillas/plantilla::header"></header>
    <div th:replace="plantillas/plantilla::menu"></div>
    <div th:replace="plantillas/plantilla::notificaciones"></div>

    <div class="container my-4 animated-fadeIn">
        <form th:action="@{/guardarTecnicoEmpresa}" method="post" th:object="${tecnico}" enctype="multipart/form-data">
            <input type="hidden" name="usuario.idUsuario" th:value="${tecnico.usuario != null ? tecnico.usuario.idUsuario : ''}"/>

            <div class="sigma-card">
                <div class="sigma-card-header">
                    <h2 class="sigma-card-title mb-0">
                        <i class="fas fa-building-user text-primary"></i>
                        <span>Datos de Empresa del Técnico</span>
                    </h2>
                    <div class="d-flex align-items-center gap-2">
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="fas fa-save me-1"></i> Guardar
                        </button>
                        <a th:href="@{/gestionUsuarios}" class="btn btn-secondary btn-sm">
                            <i class="fas fa-arrow-left me-1"></i> Volver
                        </a>
                    </div>
                </div>

                <!-- Content Container -->
                <div class="p-3 rounded-3 border mb-4" style="background: var(--bg-surface-elevated); border-color: var(--border-color) !important;">
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="legajo" class="form-label detencion-label">Legajo</label>
                            <input type="text" th:field="*{legajo}" class="form-control" id="legajo">
                        </div>
                        <div class="col-md-6">
                            <label for="estado" class="form-label detencion-label">Estado</label>
                            <select th:field="*{estado}" class="form-select" id="estado" required>
                                <option value="0">Seleccione un estado</option>
                                <option value="activo">Activo</option>
                                <option value="licencia médica">Licencia médica</option>
                                <option value="vacaciones">Vacaciones</option>
                                <option value="suspendido">Suspendido</option>
                                <option value="baja">Baja</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="especialidad" class="form-label detencion-label">Especialidad</label>
                            <select th:field="*{especialidad}" class="form-select" id="especialidad" required>
                                <option value="0">Seleccione especialidad</option>
                                <option value="mecánica">Mecánica</option>
                                <option value="hidráulica">Hidráulica</option>
                                <option value="neumática">Neumática</option>
                                <option value="electrónica">Electrónica</option>
                                <option value="programación">Programación</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="fechaIngresoPlanta" class="form-label detencion-label">Fecha de Ingreso a Planta</label>
                            <input type="date" th:field="*{fechaIngresoPlanta}" class="form-control" id="fechaIngresoPlanta" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="habilidades" class="form-label detencion-label">
                                Habilidades
                                <i class="fa-regular fa-circle-question text-primary ms-1 custom-popover" tabindex="0" data-container="body" data-trigger="focus" data-toggle="popover" data-placement="right" data-content="Información breve relacionada al concepto del colaborador desde el punto de vista de sus superiores."></i>
                            </label>
                            <input type="text" th:field="*{habilidades}" class="form-control" id="habilidades" placeholder="Ej: Soldadura TIG, PLC Siemens, Diagnóstico asistido">
                        </div>
                        <div class="col-md-6">
                            <label for="promedioEvaluaciones" class="form-label detencion-label">
                                Promedio Gral. Evaluaciones
                                <i class="fa-regular fa-circle-question text-primary ms-1 custom-popover" tabindex="0" data-container="body" data-trigger="focus" data-toggle="popover" data-placement="right" data-content="Promedio obtenido del total de todas las calificaciones obtenidas por su desempeño. Campo de sólo lectura."></i>
                            </label>
                            <input type="text" th:field="*{promedioEvaluaciones}" class="form-control" id="promedioEvaluaciones" disabled>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="proyectosDestacados" class="form-label detencion-label">
                            Proyectos Destacados / Logros
                            <i class="fa-regular fa-circle-question text-primary ms-1 custom-popover" tabindex="0" data-container="body" data-trigger="focus" data-toggle="popover" data-placement="right" data-content="Breve listado de los proyectos más importantes o relevantes en los que el colaborador haya aportado."></i>
                        </label>
                        <textarea class="form-control" th:field="*{proyectosDestacados}" id="proyectosDestacados" rows="3" placeholder="Describa proyectos o aportes relevantes..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="notasAdicionales" class="form-label detencion-label">Notas Adicionales</label>
                        <textarea class="form-control" th:field="*{notasAdicionales}" id="notasAdicionales" rows="3" placeholder="Observaciones generales..."></textarea>
                    </div>

                </div>

                <!-- Footer Actions -->
                <div class="d-flex align-items-center justify-content-between pt-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i> Guardar
                    </button>
                    <a th:href="@{/gestionUsuarios}" class="btn btn-secondary ms-auto">
                        <i class="fas fa-arrow-left me-1"></i> Volver
                    </a>
                </div>

            </div>
        </form>
    </div>

    <!-- Scripts for Popovers -->
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof $ !== 'undefined' && $.fn.popover) {
                $('[data-toggle="popover"]').popover({ trigger: 'focus' });
            }
        });
    </script>
</body>
</html>
