<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <title>Gestor de mantenimiento | SigmaWeb</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Theme & Design System -->
    <link rel="stylesheet" th:href="@{/theme.css}" />
    <script th:src="@{/theme-toggle.js}"></script>

    <!-- Libraries -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>

<body>

    <header th:fragment="header">
        <nav class="navbar fixed-top navbar-expand-lg navbar-sigma" id="navbar">
            <div class="container-fluid">
                <div class="d-flex align-items-center gap-2">
                    <button id="toggleMenuBtn" class="btn btn-sigma-menu" title="Menú de Navegación">
                        <i class="fas fa-bars"></i>
                    </button>
                    <a class="navbar-brand sigma-brand me-3" href="/">
                        <span>SIGMA</span><span class="sigma-brand-badge">WEB</span>
                    </a>
                </div>

                <button class="navbar-toggler btn-sigma-menu" type="button" data-toggle="collapse"
                    data-target="#navbarCollapse">
                    <i class="fas fa-ellipsis-v"></i>
                </button>

                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto align-items-center my-2 my-lg-0">
                        <!-- Botones generados dinámicamente desde la lista nombresLayouts -->
                        <li th:each="nombreLayout : ${nombresLayouts}" class="nav-item">
                            <a th:href="@{'/layout/' + ${nombreLayout}}"
                                th:text="${#strings.replace(nombreLayout, '.svg', '')}"
                                th:attr="data-layout=${#strings.replace(nombreLayout, '.svg', '')}"
                                class="nav-layout-chip">
                                Layout
                            </a>
                        </li>

                        <!-- Botón de pantalla completa -->
                        <li sec:authorize="hasRole('ROLE_MONITOR') && !hasRole('ROLE_ADMIN')" class="nav-item">
                            <a id="fullscreen-button" class="nav-layout-chip">
                                <i class="fas fa-expand"></i> Pantalla completa
                            </a>
                        </li>
                    </ul>

                    <div class="d-flex align-items-center gap-2 ms-auto">
                        <!-- Switch Selector Modo Claro / Oscuro -->
                        <button class="theme-toggle-btn me-2" onclick="toggleSigmaTheme()" type="button"
                            aria-label="Cambiar tema">
                            <i id="theme-toggle-icon" class="fas fa-moon"></i>
                        </button>

                        <ul sec:authorize="isAuthenticated()" class="navbar-nav align-items-center flex-row gap-2">
                            <li class="nav-item">
                                <span class="user-info-pill">
                                    <i class="fas fa-user-circle"></i>
                                    <span sec:authentication="name">Usuario</span>
                                </span>
                            </li>
                            <li class="nav-item">
                                <span class="user-info-pill">
                                    <i class="fas fa-user-shield"></i>
                                    <span id="selRol" th:each='rol:${#authentication.getAuthorities()}'>
                                        <span hidden="true" th:if='${rol.toString().equals("ROLE_ADMIN")}'
                                            th:text='Administrador ' />
                                        <span hidden="true" th:if='${rol.toString().equals("ROLE_MANT")}'
                                            th:text='Mantenimiento ' />
                                        <span hidden="true" th:if='${rol.toString().equals("ROLE_PROD")}'
                                            th:text='Produccion ' />
                                        <span hidden="true" th:if='${rol.toString().equals("ROLE_TECNICO")}'
                                            th:text='Técnico ' />
                                        <span hidden="true" th:if='${rol.toString().equals("ROLE_MONITOR")}'
                                            th:text='Monitor ' />
                                    </span>
                                    <span id="rol"></span>
                                    <script>
                                        if (document.getElementById("selRol") && document.getElementById("selRol").children[0]) {
                                            document.getElementById("rol").innerHTML = document.getElementById("selRol").children[0].innerHTML;
                                        }
                                    </script>
                                </span>
                            </li>
                            <li class="nav-item ms-2">
                                <form method="POST" th:action="@{/logout}">
                                    <button type="submit" class="btn btn-secondary btn-sm" title="Cerrar Sesión">
                                        <i class="fas fa-sign-out-alt"></i> Salir
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <div style="height: 75px;"></div>

        <script th:inline="javascript">
            let tiempoInactividad;

            function reiniciarTemporizador() {
                clearTimeout(tiempoInactividad);
                tiempoInactividad = setTimeout(() => {
                    window.location.href = "/";
                }, 1200000); // 2 minutos (120000 milisegundos)
            }

            // Detectar movimiento del mouse, clics o teclas presionadas
            window.onload = reiniciarTemporizador;
            document.onmousemove = reiniciarTemporizador;
            document.onkeypress = reiniciarTemporizador;
            document.onclick = reiniciarTemporizador;
            document.onscroll = reiniciarTemporizador;

            let tiempoRefresco = [[${ tiempoRefresco }]] || 5000;
            let noTraerEstados = [[${ noTraerEstados }]];

            // seteo todos los atributos en "operativa" que es la condicion normal
            $("path").attr("data-estado", "operativa");

            let elementosParpadeantes = {};
            let isYellow;
            let isRed;
            let isLightRed;
            let lightRed = "rgba(255, 0, 0, 0.3)";

            if (noTraerEstados != 'no' || noTraerEstados == null) {
                // Traer estado inicial
                traerEstados();

                // Polling de respaldo cada 5 segundos para mantener estados frescos
                setInterval(function () { traerEstados(); }, 5000);

                // Conectar WebSocket - usar el context path de la app
                var contextPath = /*[[@{/}]]*/ '/inicio/';
                var wsUrl = contextPath + 'ws-sigmaweb';
                var socket = new SockJS(wsUrl);
                var stompClient = Stomp.over(socket);
                stompClient.debug = null; // Ocultar logs en consola

                stompClient.connect({}, function (frame) {
                    console.log('Conectado a WebSocket de Sigmaweb en: ' + wsUrl);
                    stompClient.subscribe('/topic/activos', function (message) {
                        var activoActualizado = JSON.parse(message.body);
                        console.log('WS recibido:', activoActualizado);
                        // Actualizar el estado en el mapa local
                        elementosParpadeantes[activoActualizado.nombre] = {
                            estado: activoActualizado.estado,
                            layout: activoActualizado.layout
                        };
                    });
                }, function (error) {
                    console.error("Error conectando a WebSocket, usando solo polling", error);
                });
            }

            function traerEstados() {
                $.ajax({
                    url: '/inicio/actualizarEstados/',   // La URL del método en tu controlador
                    type: 'GET',                  // Método HTTP
                    success: function (response) {
                        elementosParpadeantes = response;
                    },
                    error: function (error) {
                        console.error("Error en actualizacion de estados", error);
                    }
                });
            }

            setInterval(function () {
                // DEBUG: ver qué datos hay
                const keys = Object.keys(elementosParpadeantes);
                if (keys.length > 0 && !window._sigmaLogDone) {
                    console.log('[SigmaWeb] elementosParpadeantes:', JSON.stringify(elementosParpadeantes));
                    const botones = document.querySelectorAll(".nav-layout-chip[data-layout]");
                    console.log('[SigmaWeb] botones con data-layout:', botones.length);
                    botones.forEach(b => console.log('  boton data-layout:', JSON.stringify(b.getAttribute('data-layout'))));
                    window._sigmaLogDone = true;
                }

                // 1. Construir set de layouts con activos detenidos
                const layoutsConDetenida = new Set();
                Object.entries(elementosParpadeantes).forEach(function ([nombre, datos]) {
                    if (!datos || !datos.layout) return;
                    const layoutNombre = datos.layout.replace('.svg', '').trim();
                    if (datos.estado === "detenida") {
                        layoutsConDetenida.add(layoutNombre);
                        console.log('[SigmaWeb] Detenida en layout:', layoutNombre);
                    }
                });

                // 2. Aplicar/quitar clase blink en botones del header
                document.querySelectorAll(".nav-layout-chip[data-layout]").forEach(function (boton) {
                    const layoutName = boton.getAttribute('data-layout');
                    if (layoutName && layoutsConDetenida.has(layoutName)) {
                        boton.classList.add("detenida-blink");
                    } else {
                        boton.classList.remove("detenida-blink");
                    }
                });

                // Botones sin data-layout (fallback por si no se cargaron con el atributo)
                document.querySelectorAll(".nav-layout-chip:not([data-layout])").forEach(function (boton) {
                    console.warn('[SigmaWeb] Botón sin data-layout encontrado:', boton.textContent.trim(), boton.outerHTML.substring(0, 120));
                });

                // (lógica de parpadeo en SVG)
                Object.entries(elementosParpadeantes).forEach(function ([nombre, datos]) {
                    let elementoSvg = document.getElementById(nombre);
                    const estado = datos.estado;

                    if (elementoSvg) {
                        elementoSvg.removeAttribute("fill");
                        if (estado == "detenida") {
                            isRed = (elementoSvg.style.fill === 'red');
                            elementoSvg.style.fill = isRed ? 'transparent' : 'red';
                            elementoSvg.setAttribute("data-estado", "detenida");
                        } else if (estado == "liberada") {
                            isYellow = (elementoSvg.style.fill === 'yellow');
                            elementoSvg.style.fill = isYellow ? 'transparent' : 'yellow';
                            elementoSvg.setAttribute("data-estado", "liberada");
                        } else if (estado == "disponible") {
                            elementoSvg.style.fill = 'rgba(255, 165, 0, 0.5)';
                            elementoSvg.setAttribute("data-estado", "disponible");
                        } else if (estado === "operativa condicionada") {
                            elementoSvg.style.fill = 'rgba(255, 0, 0, 0.3)';
                            elementoSvg.setAttribute("data-estado", "operativa condicionada");
                        } else if (estado === "operativa") {
                            elementoSvg.style.fill = '';
                            elementoSvg.setAttribute("data-estado", "operativa");
                        }
                    }
                });
            }, 500);
        </script>
    </header>

    <div th:fragment="logo">
        <style>
            .logo-esquina {
                position: fixed;
                bottom: 15px;
                right: 15px;
                width: 130px;
                opacity: 0.85;
                transition: opacity 0.3s ease, transform 0.3s ease;
                z-index: 990;
                filter: drop-shadow(0px 2px 8px rgba(0, 0, 0, 0.15));
            }

            .logo-esquina:hover {
                opacity: 1;
                transform: scale(1.03);
            }
        </style>
        <img class="logo-esquina" th:src="'/inicio/recursos/imagenes/logoActivo.png'" />
    </div>

    <div th:fragment="menu">
        <div id="sideMenu" class="vertical-menu">
            <div class="vertical-menu-content">
                <div sec:authorize="not hasRole('ROLE_MONITOR') or hasRole('ROLE_ADMIN')">

                    <a th:href="@{/dashboard}" class="btn" sec:authorize="isAuthenticated()">
                        <i class="fas fa-chart-line"></i> Dashboard
                    </a>

                    <div sec:authorize="hasRole('ROLE_PROD')">
                        <input type="hidden" name="url" id="url" value="/layout">
                    </div>

                    <div sec:authorize="hasRole('ROLE_ADMIN')">
                        <a th:href="@{/tareas}" class="btn">
                            <i class="fas fa-exclamation-triangle"></i> Detenciones
                        </a>
                    </div>
                    <div sec:authorize="hasRole('ROLE_ADMIN')">
                        <div th:if="${habilitarGestionUsuarios == 'si'}">
                            <a th:href="@{/gestionUsuarios}" class="btn">
                                <i class="fas fa-users-cog"></i> Gestión de usuarios
                            </a>
                        </div>
                    </div>

                    <a th:href="@{/registro}" class="btn">
                        <i class="fas fa-history"></i> Registro histórico
                    </a>

                    <a th:href="@{/perfil/}" class="btn"
                        sec:authorize="hasRole('ROLE_TECNICO') and not hasRole('ROLE_ADMIN')">
                        <i class="fas fa-user-tie"></i> Mi Perfil
                    </a>

                    <div sec:authorize="hasRole('ROLE_ADMIN') or hasRole('ROLE_MANT')" class="sigma-card p-3 my-2"
                        style="background: var(--bg-surface-elevated);">
                        <label class="form-label font-weight-bold mb-2 text-muted"
                            style="font-size:0.8rem; text-transform:uppercase;">Datos de técnicos</label>
                        <form th:action="@{/perfilTecnico}" method="get">
                            <input type="hidden" name="url" id="url" value="/layout">
                            <div class="mb-2">
                                <select name="id" class="form-select">
                                    <option th:each="tecnico : ${tecnicos}" th:if="${tecnico.nombre != null}"
                                        th:value="${tecnico.id}" th:text="${tecnico.nombre + ' ' + tecnico.apellido}">
                                    </option>
                                </select>
                            </div>
                            <div th:if="${tecnicos != null and tecnicos.size > 0}">
                                <button type="submit" class="btn btn-primary btn-block btn-sm">
                                    <i class="fas fa-search"></i> Ver datos
                                </button>
                            </div>
                        </form>
                    </div>

                    <a id="botonInformes" th:href="@{/informes}" class="btn">
                        <i class="fas fa-file-alt"></i> Informes
                    </a>
                    <div th:if="${habilitarEditorLayout == 'si'}">
                        <div sec:authorize="hasRole('ROLE_ADMIN')">
                            <a id="botonEditor" th:href="@{/crearLayout}" class="btn">
                                <i class="fas fa-drafting-compass"></i> Editor layout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            $(document).ready(function () {
                const $btn = $('#toggleMenuBtn');
                const $menu = $('#sideMenu');

                // Alternar menú
                $btn.on('click', function (e) {
                    e.stopPropagation();
                    $menu.toggleClass('active');
                });

                // Cerrar menú al hacer clic fuera
                $(document).on('click', function (e) {
                    if (!$menu.is(e.target) && $menu.has(e.target).length === 0 && !$btn.is(e.target) && $btn.has(e.target).length === 0) {
                        $menu.removeClass('active');
                    }
                });

                // Cerrar al scroll
                $(window).on('scroll', function () {
                    $menu.removeClass('active');
                });
            });
        </script>
    </div>

    <div th:fragment="notificaciones">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
        <input type="hidden" id="cantidadActivosDetenidos" th:value="${cantidadActivosDetenidos}" />
        <script>
            toastr.options = {
                "closeButton": true,
                "debug": false,
                "newestOnTop": false,
                "progressBar": true,
                "positionClass": "toast-bottom-right",
                "preventDuplicates": false,
                "showDuration": "300",
                "hideDuration": "1000",
                "timeOut": "5000",
                "extendedTimeOut": "2000",
                "showEasing": "swing",
                "hideEasing": "linear",
                "showMethod": "fadeIn",
                "hideMethod": "fadeOut"
            };
        </script>
    </div>

    <footer th:fragment="footer" class="mt-5 py-4 border-top text-center text-muted"
        style="border-color: var(--border-color) !important; background: var(--bg-surface);">
        <div class="container">
            <small>&copy; SigmaWeb Maintenance Management System. Todos los derechos reservados.</small>
        </div>
    </footer>
</body>

</html>
