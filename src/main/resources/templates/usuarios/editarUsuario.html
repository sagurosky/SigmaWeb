<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="plantillas/plantilla::head">
        <title>Gestor de mantenimiento - Editar Usuario</title>
    </head>
    <body>
        <header th:replace="plantillas/plantilla::header">lista de tareas</header>
        <div th:replace="plantillas/plantilla::notificaciones"></div>

        <div class="container my-4">
            <div class="text-center">
                <h1>Editar usuario</h1>
            </div>
            <br>
            <div class="card mx-auto" style="max-width: 40rem;">
                <form method="POST" th:action="@{/guardarUsuarioEditado}" th:object="${usuario}" class="form-group">
                    <input type="hidden" name="idUsuario" th:value="*{idUsuario}"/>
                    
                    <div class="card-header font-weight-bold" th:text="'Editar usuario: ' + *{username}">
                        Editar usuario
                    </div>
                    <div class="card-body">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="usernameInput" name="username" th:field="*{username}" placeholder="Usuario" required="true">
                            <label for="usernameInput">Usuario</label>
                            <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger">Error en usuario</span>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="passwordInput" name="password" placeholder="Nueva contraseña (opcional)">
                            <label for="passwordInput">Nueva contraseña (opcional)</label>
                            <small class="form-text text-muted">Dejar en blanco para conservar la contraseña actual.</small>
                        </div>

                        <h4>Roles:</h4>
                        <div class="ps-3 mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rolAdministrador" name="rol" value="ROLE_ADMIN"
                                       th:checked="${usuario.roles != null and #lists.contains(usuario.roles.![nombre], 'ROLE_ADMIN')}"/>
                                <label class="form-check-label" for="rolAdministrador">Administrador</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rolMantenimiento" name="rol" value="ROLE_MANT"
                                       th:checked="${usuario.roles != null and #lists.contains(usuario.roles.![nombre], 'ROLE_MANT')}"/>
                                <label class="form-check-label" for="rolMantenimiento">Mantenimiento</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rolProduccion" name="rol" value="ROLE_PROD"
                                       th:checked="${usuario.roles != null and #lists.contains(usuario.roles.![nombre], 'ROLE_PROD')}"/>
                                <label class="form-check-label" for="rolProduccion">Producción</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rolTecnico" name="rol" value="ROLE_TECNICO" onclick="chequearTecnico(this)"
                                       th:checked="${usuario.roles != null and #lists.contains(usuario.roles.![nombre], 'ROLE_TECNICO')}"/>
                                <label class="form-check-label" for="rolTecnico">Técnico</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rolMonitor" name="rol" value="ROLE_MONITOR"
                                       th:checked="${usuario.roles != null and #lists.contains(usuario.roles.![nombre], 'ROLE_MONITOR')}"/>
                                <label class="form-check-label" for="rolMonitor">Monitor</label>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <input type="submit" value="Guardar" class="btn btn-primary me-2"/>
                            <a th:href="@{/gestionUsuarios}" class="btn btn-secondary">Regresar</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <script>
            function chequearTecnico(elemento) {
                if (elemento.checked === true) {
                    elemento.checked = false;
                    alert("No podés convertir un usuario a técnico. Los técnicos deben generarse como nuevos para cargar sus datos.");
                } else {
                    elemento.checked = true;
                    alert("No podés quitar el rol de un técnico directamente. Si deseas cambiarlo, eliminalo y generá un usuario nuevo.");
                }
            }

            document.addEventListener("DOMContentLoaded", function() {
                const checkboxes = document.querySelectorAll("input[name='rol']");
                const adminCheckbox = document.getElementById("rolAdministrador");

                const checkedBoxes = Array.from(checkboxes).filter(cb => cb.checked);
                if (checkedBoxes.length > 1 && adminCheckbox.checked) {
                    checkboxes.forEach(cb => {
                        if (cb !== adminCheckbox) cb.checked = false;
                    });
                }

                checkboxes.forEach(checkbox => {
                    checkbox.addEventListener("change", function() {
                        if (this.checked) {
                            if (this === adminCheckbox) {
                                checkboxes.forEach(cb => {
                                    if (cb !== adminCheckbox) cb.checked = false;
                                });
                            } else {
                                checkboxes.forEach(cb => {
                                    if (cb !== this) cb.checked = false;
                                });
                            }
                        }
                    });
                });
            });
        </script>
    </body>
</html>
