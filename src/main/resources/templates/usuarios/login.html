<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="plantillas/plantilla::head">
    <title>Iniciar Sesión | SigmaWeb</title>
</head>

<link rel="stylesheet" th:href="@{/login.css}" />

<body class="login-body">

    <div class="login-wrapper">
        <div class="login-card-container">

            <!-- Left Panel: Brand & Tagline -->
            <div class="login-brand-panel">
                <div class="login-logo-wrapper">
                    <img th:src="@{/recursos/imagenes/logo.png}"
                        onerror="this.onerror=null; this.src='/inicio/imagenes/logo-hisan.png';" alt="SigmaWeb Logo"
                        class="login-logo-img" />
                </div>

                <div class="letters">
                    <span class="letter">S</span>
                    <span class="letter">I</span>
                    <span class="letter">G</span>
                    <span class="letter letter-accent" id="pp" title="SigmaWeb Maintenance">M</span>
                    <span class="letter">A</span>
                    <span class="letter-badge">Web</span>
                </div>

                <div class="words">
                    <p class="word-line">Sistema Integral de Gestión de Mantenimiento</p>
                </div>
            </div>

            <!-- Right Panel: Login Form -->
            <div class="login-form-panel">
                <div class="login-form-header">
                    <div class="login-form-icon">
                        <i class="fas fa-user-lock"></i>
                    </div>
                    <h1 class="login-form-title">Acceso al Sistema</h1>
                    <p class="login-form-subtitle">Ingrese sus credenciales para continuar</p>
                </div>

                <!-- Error Alert Message -->
                <div id="mensajeError" class="login-error-alert" style="display: none;">
                    <i class="fas fa-circle-exclamation me-1 fs-5"></i>
                    <span>Usuario o contraseña incorrectos</span>
                </div>

                <!-- Login Form -->
                <form method="POST" th:action="@{/login}">
                    <div class="input-group-custom" id="groupUsername">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="usernameInput" name="username" class="form-control-custom"
                            placeholder="Nombre de usuario" required autocomplete="username" />
                    </div>

                    <div class="input-group-custom" id="groupPassword">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="passwordInput" name="password" class="form-control-custom"
                            placeholder="Contraseña" required autocomplete="current-password" />
                        <i class="fas fa-eye password-toggle-btn" id="togglePasswordBtn"
                            title="Mostrar/Ocultar Contraseña"></i>
                    </div>

                    <button type="submit" class="btn-sigma-submit">
                        <i class="fas fa-right-to-bracket me-1"></i> Iniciar Sesión
                    </button>
                </form>
            </div>

        </div>

        <!-- Secret Administrative Panel (Primer Admin) -->
        <div class="container primerAdmin" style="display: none;">
            <div class="row">
                <div class="col-md-6 mx-auto">
                    <div class="card">
                        <div class="card-header">
                            <h4>Crear admin por primera vez</h4>
                        </div>
                        <div class="card-body">
                            <form method="POST" th:action="@{/generarAdmin}" th:object="${usuario}">
                                <div class="form-group">
                                    <label for="adminUsername">Username:</label>
                                    <input type="text" id="adminUsername" name="username" />
                                </div>
                                <div class="form-group">
                                    <label for="adminPassword">Password:</label>
                                    <input type="password" id="adminPassword" name="password" />
                                </div>
                                <input type="submit" value="Generar Admin" class="btn btn-primary btn-block mt-3" />
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <a id="recargarForm" th:href="@{/recargar-config}" style="display: none;"></a>


    </div>

    <!-- Scripts for Login Page UX -->
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const mensajeError = document.getElementById('mensajeError');
            const usernameInput = document.getElementById('usernameInput');
            const passwordInput = document.getElementById('passwordInput');
            const groupUsername = document.getElementById('groupUsername');
            const groupPassword = document.getElementById('groupPassword');

            // UX Optimization: If login error occurred (?error in URL), skip entrance animations and highlight inputs
            if (params.has('error')) {
                document.body.classList.add('has-error-state');
                if (mensajeError) {
                    mensajeError.style.display = 'flex';
                }
                if (groupUsername) groupUsername.classList.add('has-error');
                if (groupPassword) groupPassword.classList.add('has-error');

                // Focus password input directly for quick re-entry
                if (passwordInput) {
                    passwordInput.focus();
                }
            } else if (usernameInput) {
                // Focus username by default if no error
                usernameInput.focus();
            }

            // Toggle Password Visibility
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', function () {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    this.classList.toggle('fa-eye', !isPassword);
                    this.classList.toggle('fa-eye-slash', isPassword);
                });
            }

            // Administrative Secret Trigger (click on letter 'M' / #pp)
            const ppBtn = document.getElementById("pp");
            if (ppBtn) {
                ppBtn.addEventListener("click", function () {
                    $(".primerAdmin").toggle(300);
                });
            }
        });
    </script>
</body>

</html>
