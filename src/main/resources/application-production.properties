logging.pattern.dateformat=hh:mm
spring.main.banner-mode=off
spring.thymeleaf.cache=false

# Base de datos MySQL local en AWS EC2
spring.datasource.url=jdbc:mysql://localhost:3306/mantenimiento?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC-3&allowPublicKeyRetrieval=true
spring.datasource.username=sigmaweb
spring.datasource.password=qe8u23se65
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=-03:00
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=off
spring.jpa.hibernate.ddl-auto=update

# Sesiones y Carga de archivos
server.servlet.session.timeout=-1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/inicio
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Servidor web y Proxy inverso (Nginx en AWS EC2)
# La app corre detrás de Nginx en https://sigmawebapp.com/inicio
server.port=8080
server.servlet.context-path=/inicio
server.forward-headers-strategy=framework

# Logs
logging.level.org.springframework.security=INFO
logging.level.mantenimiento.gestorTareas.modulo.suscripcion=INFO
